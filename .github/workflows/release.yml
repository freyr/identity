# On each push to main: compute the next version from the squash commit title, push the
# tag vX.Y.Z and create the GitHub release. Packagist reads the new tag through its webhook.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.release.outputs.releases }}
    steps:
      - id: release
        uses: freyr/.github/actions/release@3f8fbbcf74283946ee3a7f63e21dd19bf02cdb77 # v1.0.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
