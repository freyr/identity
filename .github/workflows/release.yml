# On each push to main: compute the next version from the squash commit title, push the
# tag vX.Y.Z and create the GitHub release. The packagist job then asks packagist.org to read
# the repo; it is the only caller of packagist.org, and the repo has no Packagist webhook.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.release.outputs.releases }}
    steps:
      - id: release
        uses: freyr/.github/actions/release@93b8d0f624ac287b129f2d33c838959329fdaf9d # v2.1.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  packagist:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: freyr/.github/actions/packagist@93b8d0f624ac287b129f2d33c838959329fdaf9d # v2.1.0
        with:
          username: ${{ vars.PACKAGIST_USERNAME }}
          api-token: ${{ secrets.PACKAGIST_API_TOKEN }}
